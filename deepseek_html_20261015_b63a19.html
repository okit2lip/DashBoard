<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд детского сада</title>
<style>
  /* ========== БАЗА ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --glass-bg: rgba(255, 255, 255, 0.15);
    --glass-border: rgba(255, 255, 255, 0.3);
    --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
    --text-primary: #1a1a2e;
    --text-light: #ffffff;
    --accent: #6c8cff;
    --accent-2: #a78bfa;
    --accent-3: #f472b6;
    --success: #34d399;
    --warning: #fbbf24;
  }
  
  body {
    font-family: 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #43e97b 100%);
    background-size: 400% 400%;
    animation: gradientShift 20s ease infinite;
    padding: 20px;
    color: var(--text-primary);
    overflow-x: hidden;
  }
  
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  
  /* Плавающие пузыри для эффекта Liquid Glass */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #fbbf24, transparent);
    top: -100px; left: -100px;
    animation: float1 15s ease-in-out infinite;
  }
  body::after {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #f472b6, transparent);
    bottom: -150px; right: -150px;
    animation: float2 18s ease-in-out infinite;
  }
  @keyframes float1 { 50% { transform: translate(100px, 80px); } }
  @keyframes float2 { 50% { transform: translate(-120px, -100px); } }
  
  /* ========== СЕТКА ========== */
  .dashboard {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-auto-rows: minmax(180px, auto);
    gap: 18px;
    max-width: 1920px;
    margin: 0 auto;
  }
  
  .header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 28px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: var(--glass-shadow);
    color: var(--text-light);
  }
  
  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  
  .header .clock {
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  
  .header .date {
    font-size: 0.95rem;
    opacity: 0.9;
    text-align: right;
  }
  
  /* ========== ВИДЖЕТЫ ========== */
  .widget {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    box-shadow: var(--glass-shadow);
    padding: 22px;
    color: var(--text-light);
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .widget:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(31, 38, 135, 0.3);
  }
  
  .widget::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  }
  
  .widget-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0.85;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  
  .widget-title .icon {
    font-size: 1.1rem;
  }
  
  /* Раскладка виджетов */
  #widget-schedule { grid-column: span 7; grid-row: span 2; }
  #widget-meals { grid-column: span 5; grid-row: span 2; }
  #widget-attendance { grid-column: span 7; grid-row: span 2; }
  #widget-calendar { grid-column: span 5; grid-row: span 2; }
  
  @media (max-width: 1100px) {
    #widget-schedule, #widget-meals,
    #widget-attendance, #widget-calendar {
      grid-column: 1 / -1;
      grid-row: auto;
    }
  }
  
  /* ========== ВИДЖЕТ 1: РЕЖИМ ДНЯ ========== */
  .group-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  
  .group-tab {
    padding: 8px 16px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 14px;
    color: var(--text-light);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  
  .group-tab:hover { background: rgba(255,255,255,0.22); }
  
  .group-tab.active {
    background: rgba(255,255,255,0.9);
    color: #4c1d95;
    box-shadow: 0 4px 20px rgba(255,255,255,0.4);
  }
  
  .current-moment {
    text-align: center;
    padding: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 18px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  
  .current-moment .label {
    font-size: 0.8rem;
    opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  
  .current-moment .value {
    font-size: 1.7rem;
    font-weight: 700;
    text-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  
  .current-moment .time-range {
    font-size: 0.9rem;
    opacity: 0.85;
    margin-top: 6px;
  }
  
  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 14px;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #fbbf24, #f472b6, #a78bfa);
    border-radius: 8px;
    transition: width 0.8s ease;
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
  }
  
  .mode-list {
    max-height: 220px;
    overflow-y: auto;
    padding-right: 6px;
  }
  
  .mode-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 6px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    font-size: 0.88rem;
    transition: all 0.3s ease;
  }
  
  .mode-item.active {
    background: rgba(255,255,255,0.25);
    border-left: 3px solid #fbbf24;
    font-weight: 600;
  }
  
  .mode-item .time { opacity: 0.85; font-variant-numeric: tabular-nums; }
  
  /* Скроллбар */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
  }
  
  /* ========== ВИДЖЕТ 2: ПИТАНИЕ ========== */
  .meal-hero {
    text-align: center;
    padding: 22px 16px;
    background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(244,114,182,0.25));
    border-radius: 18px;
    margin-bottom: 14px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  
  .meal-hero .emoji {
    font-size: 2.6rem;
    margin-bottom: 6px;
    display: block;
  }
  
  .meal-hero .name {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  
  .meal-hero .time {
    font-size: 0.9rem;
    opacity: 0.85;
  }
  
  .meal-menu {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .menu-item {
    padding: 10px 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    font-size: 0.88rem;
    border-left: 3px solid transparent;
    transition: all 0.3s ease;
  }
  
  .menu-item.delivered {
    border-left-color: var(--success);
    background: rgba(52, 211, 153, 0.12);
  }
  
  .menu-item.in-progress {
    border-left-color: var(--warning);
    background: rgba(251, 191, 36, 0.15);
    animation: pulse 2s ease infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }
  
  .delivery-schedule {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 0.72rem;
    opacity: 0.8;
    gap: 4px;
  }
  
  .delivery-slot {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    transition: all 0.3s ease;
  }
  
  .delivery-slot.active {
    background: rgba(52, 211, 153, 0.3);
    font-weight: 700;
  }
  
  /* ========== ВИДЖЕТ 3: РАСПИСАНИЕ ЗАНЯТИЙ ========== */
  .lesson-groups {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 10px;
  }
  
  .lesson-card {
    padding: 14px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    border-left: 3px solid rgba(255,255,255,0.25);
    transition: all 0.3s ease;
  }
  
  .lesson-card.active {
    background: rgba(255,255,255,0.22);
    border-left-color: #fbbf24;
    box-shadow: 0 4px 20px rgba(251,191,36,0.25);
  }
  
  .lesson-card .group-name {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.8;
    margin-bottom: 6px;
  }
  
  .lesson-card .lesson-name {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  
  .lesson-card .lesson-time {
    font-size: 0.8rem;
    opacity: 0.85;
  }
  
  .lesson-card .free-time {
    font-size: 0.85rem;
    font-style: italic;
    opacity: 0.8;
  }
  
  /* ========== ВИДЖЕТ 4: ПОСЕЩАЕМОСТЬ ========== */
  .attendance-summary {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  
  .att-stat {
    flex: 1;
    text-align: center;
    padding: 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
  }
  
  .att-stat .value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
  }
  
  .att-stat .label {
    font-size: 0.72rem;
    opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 6px;
  }
  
  .group-att {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    font-size: 0.85rem;
    transition: all 0.3s ease;
  }
  
  .group-att:hover { background: rgba(255,255,255,0.16); }
  
  .group-att .name { opacity: 0.9; }
  
  .group-att .count {
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.15);
    font-size: 0.9rem;
  }
  
  .group-att.leader .count {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #fff;
    box-shadow: 0 0 12px rgba(251,191,36,0.5);
  }
  
  .group-att.leader .name::before {
    content: '🏆 ';
  }
  
  /* ========== ВИДЖЕТ 5: КАЛЕНДАРЬ ========== */
  .calendar-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
    padding-right: 6px;
  }
  
  .event-card {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    transition: all 0.3s ease;
    border-left: 3px solid transparent;
  }
  
  .event-card.today {
    border-left-color: #f472b6;
    background: rgba(244, 114, 182, 0.15);
  }
  
  .event-card.soon {
    border-left-color: #fbbf24;
  }
  
  .event-date {
    min-width: 50px;
    text-align: center;
    padding: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
  }
  
  .event-date .day {
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1;
  }
  
  .event-date .month {
    font-size: 0.7rem;
    text-transform: uppercase;
    opacity: 0.85;
    margin-top: 3px;
  }
  
  .event-info { flex: 1; }
  
  .event-info .title {
    font-size: 0.92rem;
    font-weight: 700;
    margin-bottom: 3px;
  }
  
  .event-info .meta {
    font-size: 0.75rem;
    opacity: 0.8;
  }
  
  /* ========== СОСТОЯНИЕ "ЖДЁМ" ========== */
  .waiting-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    min-height: 200px;
  }
  
  .waiting-state .emoji {
    font-size: 3.5rem;
    margin-bottom: 12px;
    animation: bounce 2s ease infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  
  .waiting-state .text {
    font-size: 1.4rem;
    font-weight: 700;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  
  .waiting-state .subtext {
    font-size: 0.9rem;
    opacity: 0.8;
    margin-top: 8px;
  }
  
  /* ========== АДАПТИВ ========== */
  @media (max-width: 700px) {
    body { padding: 12px; }
    .header { flex-direction: column; gap: 10px; text-align: center; padding: 14px; }
    .header h1 { font-size: 1.3rem; }
    .header .clock { font-size: 1.6rem; }
    .header .date { text-align: center; }
    .dashboard { gap: 12px; }
    .widget { padding: 16px; border-radius: 18px; }
  }
</style>
</head>

<div class="dashboard">

  <!-- ===== ШАПКА ===== -->
  <header class="header">
    <h1>🌈 Детский сад «Солнышко»</h1>
    <div style="text-align:right;">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">—</div>

  <section class="widget" id="widget-schedule">

    <div class="group-tabs" id="groupTabs"></div>

  </section>

  <!-- ===== ВИДЖЕТ 2: ПИТАНИЕ ===== -->
  <section class="widget" id="widget-meals">
    <div class="widget-title"><span class="icon">🍽️</span> Питание</div>
    <div id="mealsContent"></div>

  <!-- ===== ВИДЖЕТ 3: РАСПИСАНИЕ ЗАНЯТИЙ ===== -->
  <section class="widget" id="widget-attendance">

    <div class="lesson-groups" id="lessonsContent"></div>

  <!-- ===== ВИДЖЕТ 4: ПОСЕЩАЕМОСТЬ ===== -->
  <section class="widget" id="widget-calendar">
    <div class="widget-title"><span class="icon">👶</span> Посещаемость</div>
    <div id="attendanceContent"></div>
  </section>

  <!-- ===== ВИДЖЕТ 5: КАЛЕНДАРЬ ===== -->
  <section class="widget" style="grid-column: 1 / -1;">
    <div class="widget-title"><span class="icon">📅</span> Календарь событий</div>
    <div class="calendar-list" id="calendarContent"></div>
  </section>

</div>

  }

// Меню и график питания
const MEALS = [
  { key: 'breakfast', name: 'Завтрак', emoji: '🥣', time: '08:00-08:40',
    menu: ['Каша рисовая', 'Бутерброд с маслом', 'Какао', 'Яблоко'],
    delivery: ['07:45', '08:00', '08:15', '08:30'] },
  { key: 'snack2', name: 'Второй завтрак', emoji: '🍎', time: '09:30-09:45',
    menu: ['Сок яблочный', 'Печенье'],
    delivery: ['09:20', '09:30'] },
  { key: 'lunch', name: 'Обед', emoji: '🍲', time: '12:15-12:45',
    menu: ['Суп овощной', 'Пюре картофельное', 'Котлета куриная', 'Салат из свежих овощей', 'Компот'],
    delivery: ['11:55', '12:05', '12:15', '12:25', '12:35'] },
  { key: 'snack3', name: 'Полдник', emoji: '🥛', time: '15:00-15:30',
    menu: ['Кефир', 'Булочка домашняя', 'Фрукты'],
    delivery: ['14:45', '15:00', '15:15'] },
  { key: 'dinner', name: 'Ужин', emoji: '🍽️', time: '16:30-17:00',
    menu: ['Рыбные котлеты', 'Овощное рагу', 'Чай'],
    delivery: ['16:15', '16:30', '16:45'] }
];

// Посещаемость
const ATTENDANCE = {
  'Ясельная №1': 12, 'Ясельная №2': 14, 'Младшая №1': 18,
  'Младшая №2': 16, 'Средняя №1': 20, 'Средняя №2': 22,
  'Средняя №3': 19, 'Старшая №1': 24, 'Старшая №2': 23,
  'Старшая №3': 21, 'Подготовительная №1': 26, 'Подготовительная №2': 25,
  'Логопедическая': 10, 'Короткого пребывания': 8
};

// Календарь событий
const EVENTS = [
  { day: 15, month: 'НОЯ', title: 'Осенний утренник', meta: 'Все группы • 10:00' },
  { day: 20, month: 'НОЯ', title: 'День матери', meta: 'Старшие группы • 16:00' },
  { day: 25, month: 'НОЯ', title: 'Конкурс рисунков «Зима»', meta: 'Подготовительные группы' },
  { day: 01, month: 'ДЕК', title: 'Новогодняя ёлка', meta: 'Все группы • 11:00' },
  { day: 10, month: 'ДЕК', title: 'Родительское собрание', meta: 'Общее • 18:00' },
  { day: 28, month: 'ДЕК', title: 'Утренник «Новый год»', meta: 'Все группы • 10:30' }
];

/* =========================================================
   ЛОГИКА
   ========================================================= */

let activeGroup = GROUPS[0];

// --- Часы ---
function updateClock() {
  const now = new Date();
  const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
  const hh = String(msk.getHours()).padStart(2, '0');
  const mm = String(msk.getMinutes()).padStart(2, '0');
  const ss = String(msk.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
  
  const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  document.getElementById('date').textContent =
    `${days[msk.getDay()]}, ${msk.getDate()} ${months[msk.getMonth()]} ${msk.getFullYear()}`;
}

// --- Время в минутах ---
function toMinutes(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 60 + m;
}

// --- Текущее время в минутах (МСК) ---
function nowMinutes() {
  const now = new Date();
  const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
  return msk.getHours() * 60 + msk.getMinutes();
}

// --- Выходной/праздник ---
function isNonWorkingDay() {
  const now = new Date();
  const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
  const day = msk.getDay();
  return day === 0 || day === 6; // сб, вс
}

// --- Рабочее время сада ---
function isWorkingHours() {
  const m = nowMinutes();
  return m >= 7 * 60 && m < 19 * 60;
}

// --- Найти текущий режимный момент ---
function getCurrentMode(group) {
  const schedule = SCHEDULE[group] || SCHEDULE['default'];
  const now = nowMinutes();
  for (const item of schedule) {
    const [start, end] = item.time.split('-');
    if (now >= toMinutes(start) && now < toMinutes(end)) {
      const total = toMinutes(end) - toMinutes(start);
      const passed = now - toMinutes(start);
      return { ...item, progress: Math.round((passed / total) * 100) };
    }
  }
  return null;
}

// --- Найти текущий приём пищи ---
function getCurrentMeal() {
  const now = nowMinutes();
  let current = null;
  let upcoming = null;
  for (const meal of MEALS) {
    const [start, end] = meal.time.split('-');
    if (now >= toMinutes(start) && now < toMinutes(end)) {
      current = meal;
    } else if (toMinutes(start) > now && !upcoming) {
      upcoming = meal;
    }
  }
  return { current, upcoming };
}

// --- Найти текущее занятие ---
function getCurrentLesson(group) {
  const now = nowMinutes();
  for (const timeRange in LESSONS) {
    const [start, end] = timeRange.split('-');
    if (now >= toMinutes(start) && now < toMinutes(end)) {
      const lesson = LESSONS[timeRange][group];
      if (lesson) return { name: lesson, time: timeRange };
    }
  }
  return null;
}

/* =========================================================
   ОТРИСОВКА ВИДЖЕТОВ
   ========================================================= */

// --- Вкладки групп ---
function renderTabs() {
  const el = document.getElementById('groupTabs');
  el.innerHTML = GROUPS.map(g =>
    `<button class="group-tab ${g === activeGroup ? 'active' : ''}" data-group="${g}">${g}</button>`
  ).join('');
  el.querySelectorAll('.group-tab').forEach(btn => {
    btn.onclick = () => {
      activeGroup = btn.dataset.group;
      renderTabs();
      renderSchedule();
      renderLessons();
    };
  });
}

// --- Виджет «Режим дня» ---
function renderSchedule() {
  const el = document.getElementById('scheduleContent');
  
  if (isNonWorkingDay() || !isWorkingHours()) {
    el.innerHTML = `
      <div class="waiting-state">
        <div class="emoji">🌙</div>
        <div class="text">Ждём, когда снова встретимся</div>
        <div class="subtext">${isNonWorkingDay() ? 'Сегодня выходной' : 'Сад работает с 07:00 до 19:00'}</div>
      </div>`;
    return;
  }
  
  const current = getCurrentMode(activeGroup);
  const schedule = SCHEDULE[activeGroup] || SCHEDULE['default'];
  
  const currentHTML = current ? `
    <div class="current-moment">
      <div class="label">Сейчас · ${activeGroup}</div>
      <div class="value">${current.name}</div>
      <div class="time-range">${current.time}</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width: ${current.progress}%"></div>
      </div>
    </div>` : `
    <div class="current-moment">
      <div class="label">Сейчас</div>
      <div class="value">Свободное время</div>
    </div>`;
  
  const listHTML = schedule.map(item => {
    const isActive = current && item.time === current.time;
    return `<div class="mode-item ${isActive ? 'active' : ''}">
      <span class="name">${item.name}</span>
      <span class="time">${item.time}</span>
    </div>`;
  }).join('');
  
  el.innerHTML = currentHTML + `<div class="mode-list">${listHTML}</div>`;
}

// --- Виджет «Питание» ---
function renderMeals() {
  const el = document.getElementById('mealsContent');
  
  if (isNonWorkingDay() || !isWorkingHours()) {
    el.innerHTML = `
      <div class="waiting-state">
        <div class="emoji">🍲</div>
        <div class="text">Кухня отдыхает</div>
        <div class="subtext">Ждём, когда снова встретимся</div>
      </div>`;
    return;
  }
  
  const { current, upcoming } = getCurrentMeal();
  const meal = current || upcoming;
  
  if (!meal) {
    el.innerHTML = `<div class="waiting-state">
      <div class="emoji">😴</div>
      <div class="text">Приёмы пищи завершены</div>
      <div class="subtext">До завтра!</div>
    </div>`;
    return;
  }
  
  const isNow = !!current;
  const now = nowMinutes();
  
  // Определяем статус доставки
  const menuHTML = meal.menu.map((dish, i) => {
    const deliveryTime = meal.delivery[i] ? toMinutes(meal.delivery[i]) : 0;
    let cls = '';
    if (isNow) {
      if (now >= deliveryTime) cls = 'delivered';
      else if (now >= deliveryTime - 15) cls = 'in-progress';
    }
    const icon = cls === 'delivered' ? '✅' : cls === 'in-progress' ? '⏳' : '🍽️';
    return `<div class="menu-item ${cls}">${icon} ${dish}</div>`;
  }).join('');
  
  const deliveryHTML = meal.delivery.map(t => {
    const active = isNow && now >= toMinutes(t);
    return `<div class="delivery-slot ${active ? 'active' : ''}">${t}</div>`;
  }).join('');
  
  el.innerHTML = `
    <div class="meal-hero">
      <span class="emoji">${meal.emoji}</span>
      <div class="name">${meal.name}</div>
      <div class="time">${meal.time} ${isNow ? '· сейчас' : '· скоро'}</div>
    </div>
    <div class="meal-menu">${menuHTML}</div>
    <div class="delivery-schedule">${deliveryHTML}</div>
  `;
}

// --- Виджет «Расписание занятий» ---
function renderLessons() {
  const el = document.getElementById('lessonsContent');
  
  if (isNonWorkingDay() || !isWorkingHours()) {
    el.innerHTML = `<div class="waiting-state" style="grid-column:1/-1;">
      <div class="emoji">🌙</div>
      <div class="text">Ждём, когда снова встретимся</div>
    </div>`;
    return;
  }
  
  const html = GROUPS.map(g => {
    const lesson = getCurrentLesson(g);
    if (lesson) {
      return `<div class="lesson-card active">
        <div class="group-name">${g}</div>
        <div class="lesson-name">📖 ${lesson.name}</div>
        <div class="lesson-time">${lesson.time}</div>
      </div>`;
    }
    return `<div class="lesson-card">
      <div class="group-name">${g}</div>
      <div class="free-time">Занимаемся интересными делами</div>
    </div>`;
  }).join('');
  
  el.innerHTML = html;
}

// --- Виджет «Посещаемость» ---
function renderAttendance() {
  const el = document.getElementById('attendanceContent');
  
  const entries = Object.entries(ATTENDANCE);
  const total = entries.reduce((s, [, v]) => s + v, 0);
  const max = Math.max(...entries.map(([, v]) => v));
  const leaders = entries.filter(([, v]) => v === max).map(([k]) => k);
  
  // Сортируем по убыванию
  const sorted = [...entries].sort((a, b) => b[1] - a[1]);
  
  const gridHTML = sorted.map(([name, count]) => {
    const isLeader = leaders.includes(name);
    return `<div class="group-att ${isLeader ? 'leader' : ''}">
      <span class="name">${name}</span>
      <span class="count">${count}</span>
    </div>`;
  }).join('');
  
  el.innerHTML = `
    <div class="attendance-summary">
      <div class="att-stat"><div class="value">${total}</div><div class="label">Всего детей</div></div>
      <div class="att-stat"><div class="value">${GROUPS.length}</div><div class="label">Групп</div></div>
      <div class="att-stat"><div class="value">${Math.round(total / GROUPS.length)}</div><div class="label">Среднее</div></div>
    </div>
    <div class="groups-grid">${gridHTML}</div>
  `;
}

// --- Виджет «Календарь» ---
function renderCalendar() {
  const el = document.getElementById('calendarContent');
  
  const now = new Date();
  const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
  const today = msk.getDate();
  const month = msk.getMonth();
  
  const monthNames = ['ЯНВ','ФЕВ','МАР','АПР','МАЙ','ИЮН','ИЮЛ','АВГ','СЕН','ОКТ','НОЯ','ДЕК'];
  
  const html = EVENTS.map(ev => {
    const isToday = ev.day === today && ev.month === monthNames[month];
    const isSoon = !isToday && ev.day - today <= 3 && ev.day - today >= 0;
    return `<div class="event-card ${isToday ? 'today' : isSoon ? 'soon' : ''}">
      <div class="event-date">
        <div class="day">${ev.day}</div>
        <div class="month">${ev.month}</div>
      </div>
      <div class="event-info">
        <div class="title">${ev.title}</div>
        <div class="meta">${ev.meta}</div>
      </div>
    </div>`;
  }).join('');
  
  el.innerHTML = html;
}

/* =========================================================
   ЗАПУСК И АВТООБНОВЛЕНИЕ
   ========================================================= */

function renderAll() {
  renderTabs();
  renderSchedule();
  renderMeals();
  renderLessons();
  renderAttendance();
  renderCalendar();
}

// Первый запуск
updateClock();
renderAll();

// Часы — каждую секунду
setInterval(updateClock, 1000);

// Обновление данных — каждые 30 секунд
setInterval(() => {
  renderSchedule();
  renderMeals();
  renderLessons();
}, 30000);

// Полная перерисовка — раз в 5 минут (например, смена дня)
setInterval(renderAll, 5 * 60 * 1000);
</script>
