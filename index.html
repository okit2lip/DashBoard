<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Облачный Кит — Дашборд ДОУ №2</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-bg-strong: rgba(255, 255, 255, 0.75);
    --glass-border: rgba(255, 255, 255, 0.7);
    --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
    --text-main: #1a2340;
    --text-muted: #5a6684;
    --radius: clamp(14px, 1.4vw, 26px);
    --radius-sm: clamp(9px, 0.9vw, 16px);
    --gap: clamp(10px, 1.2vw, 22px);
    --pad-x: clamp(12px, 1.4vw, 28px);
    --pad-y: clamp(10px, 1.2vw, 24px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: clamp(12px, 0.9vw, 18px); }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text-main);
    background: #e8eefc;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -2;
    background:
      radial-gradient(circle at 15% 20%, #a5d8ff 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #ffd8a8 0%, transparent 40%),
      radial-gradient(circle at 20% 85%, #b2f2bb 0%, transparent 45%),
      radial-gradient(circle at 80% 80%, #eebefa 0%, transparent 45%),
      linear-gradient(135deg, #f1f3ff 0%, #e3ecff 100%);
    animation: floatBg 24s ease-in-out infinite alternate;
  }
  @keyframes floatBg { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(2%, -2%) scale(1.05); } }
  .bubble {
    position: fixed; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
    filter: blur(2px); z-index: -1;
    animation: floatUp 18s ease-in-out infinite; pointer-events: none;
    aspect-ratio: 1;
  }
  @keyframes floatUp { 0%,100% { transform: translateY(0) scale(1); opacity: 0.5; } 50% { transform: translateY(-40px) scale(1.1); opacity: 0.8; } }

  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--pad-y) var(--pad-x);
    margin: clamp(8px, 1vw, 20px) clamp(10px, 1.2vw, 24px) 0;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius); box-shadow: var(--glass-shadow);
    gap: clamp(8px, 1vw, 20px);
  }
  .brand { display: flex; align-items: center; gap: clamp(8px, 0.9vw, 16px); }
  .brand .logo {
    width: clamp(36px, 3vw, 64px);
    height: clamp(36px, 3vw, 64px);
    border-radius: 50%;
    background: linear-gradient(135deg, #4dabf7, #cc5de8);
    display: grid; place-items: center;
    font-size: clamp(18px, 1.6vw, 32px);
    box-shadow: 0 6px 18px rgba(77,171,247,0.4);
    flex-shrink: 0;
  }
  .brand h1 { font-size: clamp(16px, 1.4vw, 28px); font-weight: 700; letter-spacing: -0.3px; }
  .brand p { font-size: clamp(10px, 0.85vw, 15px); color: var(--text-muted); margin-top: 2px; }
  .clock { text-align: right; }
  .clock .time {
    font-size: clamp(22px, 2.4vw, 48px); font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, #4dabf7, #cc5de8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; font-variant-numeric: tabular-nums;
  }
  .clock .date { font-size: clamp(10px, 0.9vw, 16px); color: var(--text-muted); margin-top: 2px; }
  .clock .season {
    display: inline-block; margin-top: 4px; font-size: clamp(9px, 0.7vw, 13px);
    padding: 3px 10px; border-radius: 999px;
    background: rgba(77,171,247,0.15); color: #1864ab; font-weight: 600;
  }
  .dashboard {
    display: grid; grid-template-columns: 1.25fr 1.25fr 1fr;
    grid-template-rows: auto auto; gap: var(--gap);
    padding: var(--gap) var(--pad-x) clamp(14px, 1.6vw, 30px);
    min-height: calc(100dvh - clamp(70px, 8vh, 140px));
    max-width: 2560px; margin: 0 auto;
  }
  .widget {
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius); box-shadow: var(--glass-shadow);
    padding: var(--pad-y) var(--pad-x); display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  .widget::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  }
  .widget h2 {
    font-size: clamp(11px, 0.9vw, 18px); font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1.2px;
    display: flex; align-items: center; gap: 8px; margin-bottom: clamp(8px, 0.9vw, 16px);
  }
  .widget h2 .icon { font-size: clamp(15px, 1.2vw, 24px); }
  .widget.daily { grid-row: span 2; grid-column: 1; }
  .widget.lessons { grid-row: span 2; grid-column: 2; }
  .widget.food { grid-column: 3; }
  .widget.calendar { grid-column: 3; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: clamp(8px, 0.9vw, 14px); }
  .tab {
    font-size: clamp(9px, 0.7vw, 13px); padding: 6px 11px; border-radius: 999px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.6);
    color: var(--text-muted); cursor: pointer;
    transition: all .25s ease; font-weight: 600; white-space: nowrap;
  }
  .tab:hover { background: rgba(255,255,255,0.8); }
  .tab.active {
    background: linear-gradient(135deg, #4dabf7, #cc5de8);
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 12px rgba(77,171,247,0.4);
  }

  .day-list { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; padding-right: 4px; }
  .day-list::-webkit-scrollbar { width: 5px; }
  .day-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
  .moment {
    display: flex; align-items: center; gap: clamp(6px, 0.8vw, 14px);
    padding: clamp(6px, 0.7vw, 14px) clamp(8px, 0.9vw, 16px);
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.5);
    transition: all .3s ease; font-size: clamp(11px, 0.85vw, 16px);
  }
  .moment.active {
    background: linear-gradient(135deg, rgba(77,171,247,0.95), rgba(204,93,232,0.95));
    color: #fff; transform: scale(1.02);
    box-shadow: 0 8px 22px rgba(77,171,247,0.45);
  }
  .moment .m-time { font-weight: 700; font-size: clamp(9px, 0.75vw, 14px); white-space: nowrap; min-width: 92px; font-variant-numeric: tabular-nums; }
  .moment .m-name { flex: 1; font-weight: 500; }
  .moment .m-progress { width: 80px; height: 6px; border-radius: 4px; background: rgba(255,255,255,0.35); overflow: hidden; }
  .moment .m-progress > div { height: 100%; background: #fff; border-radius: 4px; transition: width 1s linear; }
  .moment:not(.active) .m-progress { display: none; }

  .waiting {
    display: grid; place-items: center; flex: 1;
    text-align: center; color: var(--text-muted);
    font-size: clamp(12px, 1vw, 18px); font-weight: 600; padding: 30px 10px;
  }
  .waiting .big { font-size: clamp(28px, 2.8vw, 56px); margin-bottom: 12px; }

  .half-badge {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: clamp(6px, 0.7vw, 12px);
    padding: clamp(5px, 0.6vw, 12px) clamp(8px, 0.9vw, 16px);
    border-radius: clamp(8px, 0.8vw, 14px);
    background: linear-gradient(135deg, rgba(77,171,247,0.15), rgba(204,93,232,0.15));
    border: 1px solid rgba(255,255,255,0.5);
  }
  .half-badge .hb-icon { font-size: clamp(13px, 1.1vw, 22px); }
  .half-badge .hb-text {
    font-size: clamp(9px, 0.75vw, 14px); font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .lesson-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(255,255,255,0.6));
    border-radius: var(--radius-sm);
    padding: clamp(10px, 1vw, 20px) clamp(12px, 1.1vw, 22px);
    margin-bottom: clamp(6px, 0.7vw, 12px);
    border-left: 5px solid #4dabf7; box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  }
  .lesson-card .l-area {
    font-size: clamp(9px, 0.7vw, 13px); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 4px;
  }
  .lesson-card .l-title { font-size: clamp(12px, 1.1vw, 20px); font-weight: 700; margin-bottom: 6px; }
  .lesson-card .l-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-size: clamp(8px, 0.65vw, 12px); font-weight: 700; padding: 3px 9px;
    border-radius: 999px; background: rgba(77,171,247,0.15);
    color: #1864ab; letter-spacing: 0.5px;
  }
  .badge.od { background: rgba(77,171,247,0.18); color: #1864ab; }
  .badge.odrm { background: rgba(204,93,232,0.18); color: #862e9c; }
  .badge.hall { background: rgba(255,212,59,0.25); color: #997404; }
  .badge.corr { background: rgba(255,107,107,0.18); color: #c92a2a; }

  .food-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(6px, 0.8vw, 14px) clamp(10px, 1.1vw, 18px);
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #ffd8a8, #ffec99); margin-bottom: clamp(8px, 0.9vw, 14px);
  }
  .food-header .f-name { font-weight: 800; font-size: clamp(12px, 1.1vw, 20px); color: #7a4a00; }
  .food-header .f-time { font-size: clamp(10px, 0.85vw, 16px); color: #7a4a00; font-weight: 600; }
  .food-items { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: 170px; }
  .food-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: clamp(10px, 0.8vw, 15px); padding: 7px 10px;
    background: rgba(255,255,255,0.5);
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.6);
  }
  .food-item .fi-name { font-weight: 500; }
  .food-item .fi-weight { color: var(--text-muted); font-size: clamp(9px, 0.7vw, 13px); font-weight: 600; white-space: nowrap; margin-left: 8px; }
  .food-subtitle {
    font-size: clamp(9px, 0.7vw, 13px); font-weight: 700; color: var(--text-muted);
    margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .cal-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 260px; padding-right: 4px; }
  .cal-item {
    display: flex; gap: clamp(6px, 0.8vw, 14px); align-items: center;
    padding: clamp(6px, 0.7vw, 12px) clamp(8px, 0.9vw, 16px);
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.6);
    transition: all .3s ease;
  }
  .cal-item.today {
    background: linear-gradient(135deg, rgba(255,138,61,0.95), rgba(255,107,107,0.95));
    color: #fff; box-shadow: 0 8px 22px rgba(255,138,61,0.4);
  }
  .cal-date {
    text-align: center; min-width: 48px;
    padding: 5px 6px; border-radius: 10px;
    background: rgba(255,255,255,0.7); color: var(--text-main);
  }
  .cal-date .d { font-size: clamp(13px, 1.1vw, 22px); font-weight: 800; line-height: 1; }
  .cal-date .m { font-size: clamp(7px, 0.55vw, 11px); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
  .cal-info { flex: 1; }
  .cal-info .ci-title { font-size: clamp(10px, 0.85vw, 16px); font-weight: 700; }
  .cal-info .ci-sub { font-size: clamp(8px, 0.7vw, 13px); opacity: 0.85; margin-top: 2px; }
  .cal-badge {
    font-size: clamp(7px, 0.55vw, 11px); padding: 3px 8px; border-radius: 999px;
    background: rgba(255,212,59,0.4); color: #7a4a00; font-weight: 700; white-space: nowrap;
  }
  .cal-item.today .cal-badge { background: rgba(255,255,255,0.35); color: #fff; }

  @media (max-width: 1280px) {
    .dashboard { grid-template-columns: 1fr 1fr; }
    .widget.daily { grid-row: span 1; grid-column: 1; }
    .widget.lessons { grid-row: span 1; grid-column: 2; }
    .widget.food { grid-column: 1; }
    .widget.calendar { grid-column: 2; }
  }
  @media (max-width: 820px) {
    .dashboard { grid-template-columns: 1fr; }
    .widget.daily, .widget.lessons, .widget.food, .widget.calendar { grid-column: 1; grid-row: auto; }
    header.topbar { flex-direction: column; gap: 12px; text-align: center; }
    .clock { text-align: center; }
  }
  @media (orientation: portrait) and (min-width: 800px) {
    .dashboard { grid-template-columns: 1fr 1fr; }
  }
  .widget { animation: fadeIn 0.8s ease both; }
  .widget:nth-child(2) { animation-delay: .1s; }
  .widget:nth-child(3) { animation-delay: .2s; }
  .widget:nth-child(4) { animation-delay: .3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<div class="bubble" style="width:8vw;top:10%;left:5%;animation-delay:0s;"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">🐳</div>
    <div>
      <h1>Облачный Кит</h1>

  <div class="clock">

    <div class="tabs" id="day-tabs"></div>
    <div id="day-content"></div>
  </section>
  <section class="widget lessons">
    <h2><span class="icon">📚</span> Расписание занятий</h2>

  <section class="widget food">
    <h2><span class="icon">🍽️</span> Питание</h2>

  </section>
  <section class="widget calendar">
    <h2><span class="icon">🎉</span> События и утренники</h2>
    <div class="cal-list" id="calendar-content"></div>
  </section>
</main>

const MONTHS_RU = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT_RU = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WEEKDAYS_RU = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

function getMoscowNow() {
  const now = new Date();
  const fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Moscow',
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  });
  const parts = {};
  fmt.formatToParts(now).forEach(p => parts[p.type] = p.value);
  return new Date(`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}`);
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function minutesOfDay(d){ return d.getHours()*60 + d.getMinutes(); }
function isWorkTime(now) {
  const day = now.getDay();
  if (day === 0 || day === 6) return false;
  const m = minutesOfDay(now);
  return m >= t(7,0) && m < t(19,0);
}
function isSummerSeason(now) {
  const mo = now.getMonth() + 1;
  return mo >= 6 && mo <= 8;
}
function getHalfOfDay(now) {
  const curMin = minutesOfDay(now);
  return curMin < t(12, 0) ? 'I' : 'II';
}
function halfOfDayLabel(half) {
  return half === 'I' ? 'I половина дня' : 'II половина дня';
}

function renderClock() {
  const now = getMoscowNow();
  document.getElementById('clock-time').textContent =
    `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('clock-date').textContent =
    `${WEEKDAYS_RU[now.getDay()]}, ${now.getDate()} ${MONTHS_RU[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById('clock-season').textContent =
    isSummerSeason(now) ? 'Летний режим (Июнь-Август)' : 'Учебный режим (Сентябрь-Май)';
}

let activeDayTab = 'Ясли';
function renderDayTabs() {
  const cats = ['Ясли','2 младшая','Средняя','Старшая','Подготовительная','Оздоровительная','Логопедическая'];
  const el = document.getElementById('day-tabs');
  el.innerHTML = cats.map(c =>
    `<button class="tab ${c===activeDayTab?'active':''}" data-cat="${c}">${DAY_REGIMES[c].label}</button>`
  ).join('');
  el.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    activeDayTab = b.dataset.cat;
    renderDayTabs(); renderDay();
  });
}
function renderDay() {
  const el = document.getElementById('day-content');
  const now = getMoscowNow();
  if (!isWorkTime(now)) {
    el.innerHTML = `<div class="waiting"><div><div class="big">🌙</div>Ждем когда снова встретимся</div></div>`;
    return;
  }
  const regime = DAY_REGIMES[activeDayTab];
  const curMin = minutesOfDay(now);
  let html = '<div class="day-list">';
  regime.moments.forEach(m => {
    const active = curMin >= m.s && curMin < m.e;
    const progress = active ? Math.round(((curMin - m.s) / (m.e - m.s)) * 100) : 0;
    const t1 = `${pad(Math.floor(m.s/60))}:${pad(m.s%60)}`;
    const t2 = `${pad(Math.floor(m.e/60))}:${pad(m.e%60)}`;
    html += `<div class="moment ${active?'active':''}">
      <div class="m-time">${t1}–${t2}</div>
      <div class="m-name">${m.n}</div>
      ${active ? `<div class="m-progress"><div style="width:${progress}%"></div></div>` : ''}
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

let activeLessonGroup = 'g1';
function renderLessonTabs() {

  ).join('');
  el.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    activeLessonGroup = b.dataset.g;
    renderLessonTabs(); renderLesson();
  });
}
function renderLesson() {
  const el = document.getElementById('lesson-content');
  const now = getMoscowNow();
  if (!isWorkTime(now)) {
    el.innerHTML = `<div class="waiting"><div><div class="big">🌙</div>Ждем когда снова встретимся</div></div>`;
    return;
  }
  const dayIdx = now.getDay();
  if (dayIdx === 0 || dayIdx === 6) {
    el.innerHTML = `<div class="waiting"><div><div class="big">🌞</div>Выходной — занимаемся интересными делами</div></div>`;
    return;
  }
  const scheduleDay = dayIdx - 1;
  const half = getHalfOfDay(now);
  const todayLessons = (SCHEDULE[activeLessonGroup] || []).filter(l => l.day === scheduleDay);
  let display = todayLessons.filter(l => l.sub === half);
  if (activeLessonGroup === 'g14') {
    if (half === 'I') {
      display = todayLessons.filter(l => l.sub === 'I' && l.abbr !== 'Коррекционный час');
    } else {
      display = todayLessons.filter(l => l.sub === 'II');
    }
  }
  if (display.length === 0) {
    el.innerHTML = `<div class="waiting"><div><div class="big">🎨</div>Занимаемся интересными делами</div></div>`;
    return;
  }
  let html = `
    <div class="half-badge">
      <span class="hb-icon">${half === 'I' ? '🌅' : '🌇'}</span>
      <span class="hb-text">Сейчас идёт: ${halfOfDayLabel(half)}</span>
    </div>
  `;
  display.forEach(l => {
    let badgeCls = 'od';
    if (l.abbr === 'ОДРМ') badgeCls = 'odrm';
    else if (l.abbr === 'ОД*') badgeCls = 'hall';
    else if (l.abbr.includes('Коррекц')) badgeCls = 'corr';
    const isCorr = l.abbr.includes('Коррекц');
    const titleText = isCorr ? 'Коррекционная работа'
      : (l.abbr === 'ОДРМ' ? 'Культурная практика' : 'Образовательная деятельность');
    html += `<div class="lesson-card" style="border-left-color:${getSubjectColor(l.subject)}">
      <div class="l-area">${l.subject}</div>
      <div class="l-title">${titleText}</div>
      <div class="l-meta">
        <span class="badge ${badgeCls}">${l.abbr}</span>
        <span class="badge">${halfOfDayLabel(l.sub)}</span>
        ${l.hall ? '<span class="badge hall">🏛 В зале</span>' : ''}
      </div>
    </div>`;
  });
  el.innerHTML = html;
}
function getSubjectColor(subj) {
  if (subj.includes('Социально')) return '#4dabf7';
  if (subj.includes('Познавательное')) return '#51cf66';
  if (subj.includes('Речевое')) return '#ff8a3d';
  if (subj.includes('Художественно')) return '#cc5de8';
  if (subj.includes('Физическое')) return '#ff6b6b';
  if (subj.includes('Игровая')) return '#ffd43b';
  if (subj.includes('Продуктивная')) return '#ff922b';
  if (subj.includes('Познавательно-исслед')) return '#20c997';
  if (subj.includes('Коммуникативная')) return '#845ef7';
  if (subj.includes('Чтение')) return '#f06595';
  if (subj.includes('Коррекц')) return '#c92a2a';
  return '#4dabf7';
}

function renderCalendar() {
  const el = document.getElementById('calendar-content');
  const now = getMoscowNow();
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  let html = '';
  EVENTS.forEach(ev => {
    const d = new Date(ev.date + 'T00:00:00');
    const isToday = ev.date === todayStr;
    const day = d.getDate();
    const mon = MONTHS_SHORT_RU[d.getMonth()];
    html += `<div class="cal-item ${isToday?'today':''}">
      <div class="cal-date"><div class="d">${day}</div><div class="m">${mon}</div></div>
      <div class="cal-info">
        <div class="ci-title">${ev.time} · ${ev.title}</div>
        <div class="ci-sub">${ev.sub}</div>
      </div>
      ${ev.badge ? `<span class="cal-badge">${ev.badge}</span>` : ''}
    </div>`;
  });
  el.innerHTML = html;
}

function updateAll() {
  renderClock();
  renderDay();
  renderLesson();
  renderFood();
  renderCalendar();
}
