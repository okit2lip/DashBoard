<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Облачный Кит — Дашборд ДОУ №2</title>
<style>
  :root { --glass-bg: rgba(255, 255, 255, 0.55); --glass-bg-strong: rgba(255, 255, 255, 0.75); --glass-border: rgba(255, 255, 255, 0.7); --glass-shadow: 0 4px 20px rgba(31, 38, 135, 0.1); --text-main: #1a2340; --text-muted: #5a6684; --radius: 16px; --radius-sm: 10px; --gap: 16px; --pad: 16px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text-main); background: #e8eefc; overflow: hidden; font-size: 16px; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -2; background: radial-gradient(circle at 15% 20%, #a5d8ff 0%, transparent 40%), radial-gradient(circle at 85% 15%, #ffd8a8 0%, transparent 40%), radial-gradient(circle at 20% 85%, #b2f2bb 0%, transparent 40%), radial-gradient(circle at 80% 80%, #eebefa 0%, transparent 40%), linear-gradient(135deg, #f1f3ff 0%, #e3ecff 100%); }
  body { display: flex; flex-direction: column; }

  /* ===== ХЕДЕР (как в дашборде «Питание») ===== */
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; margin: 18px 22px 0;
    background: var(--glass-bg-strong);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius); box-shadow: var(--glass-shadow);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo {
    width: 54px; height: 54px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(77,171,247,0.4);
    overflow: hidden;
  }
  .brand .logo img { width: 85%; height: 85%; object-fit: contain; }
  .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .brand p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .clock { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
  .clock .time {
    font-size: 34px; font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(135deg, #4dabf7, #cc5de8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .clock .date { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  .clock .season {
    display: inline-block; margin-top: 6px; font-size: 11px;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(77,171,247,0.15); color: #1864ab; font-weight: 600;
  }
  .sync-status {
    display: inline-block; margin-top: 6px; margin-left: 6px; font-size: 11px;
    padding: 3px 10px; border-radius: 999px; font-weight: 600;
    background: rgba(16,185,129,0.15); color: #087f5b;
  }
  .sync-status.loading { background: rgba(245,158,11,0.15); color: #997404; }
  .sync-status.err { background: rgba(239,68,68,0.15); color: #c92a2a; }

  /* Пузыри на фоне */
  .bubble {
    position: fixed; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
    filter: blur(2px); z-index: -1;
    animation: floatUp 18s ease-in-out infinite; pointer-events: none;
  }
  @keyframes floatUp {
    0%,100% { transform: translateY(0) scale(1); opacity: 0.5; }
    50% { transform: translateY(-40px) scale(1.1); opacity: 0.8; }
  }
  /* ===== /ХЕДЕР ===== */

  .dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: var(--gap); padding: var(--gap); min-height: 0; }
  .widget { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: var(--radius); box-shadow: var(--glass-shadow); padding: var(--pad); display: flex; flex-direction: column; overflow: hidden; position: relative; height: 100%; min-height: 0; }
  .widget h2 { font-size: 14px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-shrink: 0; }
  .scrollable { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 6px; flex: 1; min-height: 0; scroll-behavior: smooth; }
  .scrollable::-webkit-scrollbar { width: 5px; } .scrollable::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; flex-shrink: 0; }
  .tab { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.6); color: var(--text-muted); cursor: pointer; transition: all .2s; font-weight: 600; white-space: nowrap; }
  .tab:hover { background: rgba(255,255,255,0.8); } .tab.active { background: linear-gradient(135deg, #4dabf7, #cc5de8); color: #fff; border-color: transparent; }
  .moment { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.5); transition: all .3s; font-size: 14px; flex-shrink: 0; }
  .moment.active { background: linear-gradient(135deg, rgba(77,171,247,0.95), rgba(204,93,232,0.95)); color: #fff; box-shadow: 0 4px 12px rgba(77,171,247,0.45); scroll-margin: 20px; }
  .moment .m-time { font-weight: 700; font-size: 12px; white-space: nowrap; min-width: 90px; } .moment .m-name { flex: 1; font-weight: 500; }
  .moment .m-progress { width: 50px; height: 6px; border-radius: 4px; background: rgba(255,255,255,0.35); overflow: hidden; flex-shrink: 0; } .moment .m-progress > div { height: 100%; background: #fff; border-radius: 4px; transition: width 1s linear; }
  #lesson-tabs { max-height: 60px; overflow-y: auto; padding-right: 4px; }
  .half-divider { display: flex; align-items: center; gap: 8px; padding: 4px 10px; margin: 8px 0 4px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); background: rgba(255,255,255,0.7); border-radius: 8px; border-left: 3px solid #4dabf7; }
  .half-divider.active-half { border-left-color: #cc5de8; background: rgba(204,93,232,0.1); color: #862e9c; }
  .lesson-card { background: #fff; border-radius: var(--radius-sm); padding: 12px; margin-bottom: 6px; border-left: 4px solid #4dabf7; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
  .lesson-card.past { opacity: 0.6; filter: grayscale(0.3); }
  .lesson-card .l-area { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
  .lesson-card .l-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; } .lesson-card .l-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 12px; background: #e3f2fd; color: #1864ab; }
  .badge.hall { background: #fff3cd; color: #997404; } .badge.odrm { background: rgba(204,93,232,0.15); color: #862e9c; }
  .badge.sd { background: rgba(81,207,102,0.18); color: #2b8a3e; } .badge.kp { background: rgba(255,146,43,0.18); color: #d9480f; }
  .waiting { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; color: var(--text-muted); font-size: 14px; font-weight: 600; }
  .waiting .big { font-size: 36px; margin-bottom: 10px; }
  .refresh-btn { background: transparent; border: none; font-size: 16px; cursor: pointer; opacity: 0.5; transition: 0.2s; } .refresh-btn:hover { opacity: 1; transform: rotate(90deg); }

  /* Стили для питания */
  .food-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: var(--radius-sm); background: linear-gradient(135deg, #ffd8a8, #ffec99); margin-bottom: 10px; flex-shrink: 0; }
  .food-header .f-name { font-weight: 800; font-size: 15px; color: #7a4a00; }
  .food-header .f-time { font-size: 13px; color: #7a4a00; font-weight: 600; }
  .food-subtitle { font-size: 11px; font-weight: 800; color: var(--text-main); margin: 10px 0 4px; text-transform: uppercase; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 6px; display: inline-block; border-left: 3px solid #4dabf7; }
  .food-items { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; max-height: none; margin-bottom: 8px; }
  .food-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 8px 10px; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
  .food-item .fi-name { font-weight: 500; }
  .food-item .fi-weight { color: var(--text-muted); font-weight: 600; white-space: nowrap; margin-left: 8px; font-size: 12px; }

  /* Стили для событий */
  .cal-item { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: var(--radius-sm); background: #fff; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 6px; }
  .cal-item.today { background: linear-gradient(135deg, #ff8a3d, #ff6b6b); color: #fff; }
  .cal-date { text-align: center; min-width: 45px; padding: 4px; border-radius: 8px; background: rgba(0,0,0,0.05); flex-shrink: 0; }
  .cal-item.today .cal-date { background: rgba(255,255,255,0.2); }
  .cal-date .d { font-size: 16px; font-weight: 800; line-height: 1; }
  .cal-date .m { font-size: 10px; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
  .cal-info { flex: 1; }
  .cal-info .ci-title { font-size: 13px; font-weight: 700; }
  .cal-info .ci-sub { font-size: 11px; opacity: 0.8; margin-top: 2px; }
  .cal-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; background: rgba(255,212,59,0.4); color: #7a4a00; font-weight: 700; white-space: nowrap; }
  .cal-item.today .cal-badge { background: rgba(255,255,255,0.35); color: #fff; }
</style>
</head>
<body>

<div class="bubble" style="width:120px;height:120px;top:10%;left:5%;animation-delay:0s;"></div>
<div class="bubble" style="width:80px;height:80px;top:60%;left:90%;animation-delay:4s;"></div>
<div class="bubble" style="width:150px;height:150px;top:75%;left:15%;animation-delay:8s;"></div>
<div class="bubble" style="width:60px;height:60px;top:25%;left:80%;animation-delay:2s;"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">
      <img src="logo.png" alt="Логотип">
    </div>
    <div>
      <h1>Облачный Кит</h1>
      <p>ДОУ № 2 г. Липецка</p>
    </div>
  </div>
  <div class="clock">
    <div class="time" id="clock-time">--:--:--</div>
    <div class="date" id="clock-date">—</div>
    <div>
      <span class="season" id="clock-season">—</span>
      <span class="sync-status loading" id="sync-status">⏳ загрузка</span>
    </div>
  </div>
</header>

<main class="dashboard">
  <section class="widget daily">
    <h2><span class="icon">🕐</span> Режим дня</h2>
    <div class="tabs" id="day-tabs"></div>
    <div class="scrollable" id="day-content"></div>
  </section>
  <section class="widget lessons">
    <h2><span><span class="icon">📚</span> Расписание занятий</span><button class="refresh-btn" onclick="loadData()" title="Обновить данные">🔄</button></h2>
    <div class="tabs" id="lesson-tabs"></div>
    <div class="scrollable" id="lesson-content"></div>
  </section>
  <section class="widget food">
    <h2><span class="icon">🍽️</span> Питание</h2>
    <div class="scrollable" id="food-content" style="padding-right: 0;"></div>
  </section>
  <section class="widget calendar">
    <h2><span class="icon">🎉</span> События и утренники</h2>
    <div class="scrollable" id="calendar-content"></div>
  </section>
</main>

<script>
// ID ТАБЛИЦЫ И GID ЛИСТОВ
const SHEET_ID = '1pNStzDFpQCoFSE0ie_6-ma81DXDD0Ue-Tat6YXLiE18';
const SCHEDULE_GID = '1031367568'; 
const REGIME_GID = '1135698480'; 
const MENU_GID = '1072523325';
const EVENTS_GID = '1541210908'; // GID базы событий

const MENU_START_DATE = '2026-10-30'; 

const HOLIDAYS = [
  '2026-01-01', '2026-01-02', '2026-01-03', '2026-01-04', '2026-01-05', '2026-01-06', '2026-01-07', '2026-01-08', '2026-01-09', '2026-01-10', '2026-01-11',
  '2026-02-21', '2026-02-22', '2026-02-23',
  '2026-03-07', '2026-03-08', '2026-03-09',
  '2026-05-01', '2026-05-02', '2026-05-03', '2026-05-09', '2026-05-10', '2026-05-11',
  '2026-06-12', '2026-06-13', '2026-06-14',
  '2026-11-04',
  '2026-12-31'
];

function isWorkingDay(date) {
  const dayOfWeek = date.getDay();
  if (dayOfWeek === 0 || dayOfWeek === 6) return false;
  const y = date.getFullYear(); const m = String(date.getMonth() + 1).padStart(2, '0'); const d = String(date.getDate()).padStart(2, '0');
  return !HOLIDAYS.includes(`${y}-${m}-${d}`);
}

function isWorkTime(now) {
  const hours = now.getHours();
  return hours >= 7 && hours < 19;
}

function getMenuDay(now) {
  let currentDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  while (!isWorkingDay(currentDate)) {
    currentDate.setDate(currentDate.getDate() - 1);
  }
  
  let startDate = new Date(MENU_START_DATE + 'T00:00:00');
  while (!isWorkingDay(startDate)) {
    startDate.setDate(startDate.getDate() + 1);
  }

  let workDaysCount = 0;
  const cursor = new Date(startDate);
  
  while (cursor <= currentDate) {
    if (isWorkingDay(cursor)) workDaysCount++;
    cursor.setDate(cursor.getDate() + 1);
  }
  
  let menuDay = (workDaysCount - 1) % 10;
  if (menuDay < 0) menuDay += 10; 
  return menuDay + 1; 
}

function parseDateToTime(dateStr) {
  if (!dateStr) return '';
  const str = String(dateStr).trim();
  if (str.includes('T')) {
    const d = new Date(str);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  const match = str.match(/(\d{1,2}):(\d{2})/);
  if (match) {
    const h = parseInt(match[1]);
    const m = parseInt(match[2]);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }
  return str;
}
function t(h, m) { return h * 60 + m; }
const MONTHS_RU = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_SHORT_RU = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WEEKDAYS_RU = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function getMoscowNow() { const now = new Date(); const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Moscow', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }); const parts = {}; fmt.formatToParts(now).forEach(p => parts[p.type] = p.value); return new Date(`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}`); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function minutesOfDay(d){ return d.getHours()*60 + d.getMinutes(); }

/* ===== ЧАСЫ + СТАТУС СИНХРОНИЗАЦИИ ===== */
function setSyncStatus(cls, txt) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.className = 'sync-status ' + cls;
  el.textContent = txt;
}

function renderClock() {
  const now = getMoscowNow();
  document.getElementById('clock-time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('clock-date').textContent = `${WEEKDAYS_RU[now.getDay()]}, ${now.getDate()} ${MONTHS_RU[now.getMonth()]} ${now.getFullYear()}`;
  const isSummer = (now.getMonth() + 1 >= 6 && now.getMonth() + 1 <= 8);
  document.getElementById('clock-season').textContent = isSummer ? 'Летний период' : 'Учебный год';

  if (window.__syncError) {
    setSyncStatus('err', '✕ ошибка');
  } else if (window.__lastSyncTime) {
    const sec = Math.round((Date.now() - window.__lastSyncTime) / 1000);
    const ago = sec < 5 ? 'только что' : sec < 60 ? `${sec} сек` : `${Math.floor(sec/60)} мин`;
    setSyncStatus('ok', `● данные ${ago} назад`);
  }
}
/* ===== /ЧАСЫ + СТАТУС ===== */

let allLessons = []; let allRegime = []; let allMenu = []; let allEvents = [];
let activeLessonGroup = null; let activeDayGroup = '2 младшая'; 
let uniqueGroups = []; let regimeGroups = [];

function parseCSV(text) {
  const rows = []; let current = ''; let inQuotes = false; let row = [];
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (char === '"') inQuotes = !inQuotes;
    else if (char === ',' && !inQuotes) { row.push(current.trim()); current = ''; }
    else if ((char === '\n' || char === '\r') && !inQuotes) { if (current || row.length) { row.push(current.trim()); rows.push(row); row = []; current = ''; } }
    else { current += char; }
  }
  if (current || row.length) { row.push(current.trim()); rows.push(row); }
  return rows;
}

async function loadData() {
  const elL = document.getElementById('lesson-content');
  const elD = document.getElementById('day-content');
  const elF = document.getElementById('food-content');
  const elE = document.getElementById('calendar-content');
  
  setSyncStatus('loading', '⏳ обновление');
  window.__syncError = false;

  const now = getMoscowNow();
  const workTime = isWorkTime(now) && isWorkingDay(now);
  
  if (!workTime) {
    const stub = `<div class="waiting"><div><div class="big">😴</div>Скоро встретимся</div></div>`;
    elL.innerHTML = stub; elD.innerHTML = stub; elF.innerHTML = stub; elE.innerHTML = stub;
    window.__lastSyncTime = Date.now();
    setSyncStatus('ok', '● данные только что');
    return;
  }

  elL.innerHTML = `<div class="waiting"><div><div class="big">⏳</div>Загрузка...</div></div>`;
  elD.innerHTML = `<div class="waiting"><div><div class="big">⏳</div>Загрузка...</div></div>`;
  elF.innerHTML = `<div class="waiting"><div><div class="big">⏳</div>Загрузка...</div></div>`;
  elE.innerHTML = `<div class="waiting"><div><div class="big">⏳</div>Загрузка...</div></div>`;
  
  try {
    const schedRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SCHEDULE_GID}`);
    const schedText = await schedRes.text();
    const schedRows = parseCSV(schedText);
    
    allLessons = [];
    for (let i = 1; i < schedRows.length; i++) {
      const r = schedRows[i];
      if (!r[0] || r[0] === '' || r[0].includes('Date')) continue;
      allLessons.push({ group: r[0], day: r[1] || '', half: (r[2] || '').toUpperCase(), subject: r[3] || '', type: r[4] || 'ОД', isHall: r[5] === 'TRUE' });
    }

    const regimeRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${REGIME_GID}`);
    const regimeText = await regimeRes.text();
    const regimeRows = parseCSV(regimeText);

    allRegime = [];
    for (let i = 1; i < regimeRows.length; i++) {
      const r = regimeRows[i];
      if (!r[1] || r[2] === '№' || r[3] === 'Режимный момент') continue;
      allRegime.push({ season: r[0], group: r[1], order: Number(r[2]) || 99, action: r[3], start: parseDateToTime(r[4]), end: parseDateToTime(r[5]) });
    }

    const menuRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${MENU_GID}`);
    const menuText = await menuRes.text();
    const menuRows = parseCSV(menuText);

    allMenu = [];
    for (let i = 1; i < menuRows.length; i++) {
      const r = menuRows[i];
      if (!r[0] || r[1] === 'Прием_пищи') continue; 
      allMenu.push({ day: r[0], meal: r[1], dish: r[2], weight: r[3] });
    }

    const eventsRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${EVENTS_GID}`);
    const eventsText = await eventsRes.text();
    const eventsRows = parseCSV(eventsText);

    allEvents = [];
    for (let i = 1; i < eventsRows.length; i++) {
      const r = eventsRows[i];
      if (!r[0] || r[0] === 'Дата') continue; 
      allEvents.push({ 
        date: r[0], 
        time: r[1] || '', 
        title: r[2] || '', 
        topic: r[3] || '', 
        group: r[4] || '', 
        place: r[5] || '', 
        person: r[6] || '' 
      });
    }

    uniqueGroups = [...new Set(allLessons.map(l => l.group))].sort();
    if (!activeLessonGroup || !uniqueGroups.includes(activeLessonGroup)) activeLessonGroup = uniqueGroups[0];

    regimeGroups = [...new Set(allRegime.map(l => l.group))];
    if (regimeGroups.length > 0 && !regimeGroups.includes(activeDayGroup)) activeDayGroup = regimeGroups[0];

    renderLessonTabs(); renderDayTabs(); renderLesson(); renderDay(); renderMenu(); renderEvents();

    window.__lastSyncTime = Date.now();
    setSyncStatus('ok', '● данные только что');
  } catch (err) {
    console.error(err);
    window.__syncError = true;
    setSyncStatus('err', '✕ ошибка');
    const errHtml = `<div class="waiting"><div><div class="big">⚠️</div>Ошибка загрузки</div></div>`;
    elL.innerHTML = errHtml; elD.innerHTML = errHtml; elF.innerHTML = errHtml; elE.innerHTML = errHtml;
  }
}

function renderLessonTabs() { const el = document.getElementById('lesson-tabs'); if (!uniqueGroups.length) return; el.innerHTML = uniqueGroups.map(g => `<button class="tab ${g===activeLessonGroup?'active':''}" data-g="${g}">${g}</button>`).join(''); el.querySelectorAll('.tab').forEach(b => b.onclick = () => { activeLessonGroup = b.dataset.g; renderLessonTabs(); renderLesson(); }); }
function renderDayTabs() { const el = document.getElementById('day-tabs'); if (!regimeGroups.length) return; el.innerHTML = regimeGroups.map(g => `<button class="tab ${g===activeDayGroup?'active':''}" data-g="${g}">${g}</button>`).join(''); el.querySelectorAll('.tab').forEach(b => b.onclick = () => { activeDayGroup = b.dataset.g; renderDayTabs(); renderDay(); }); }

function renderLesson() { 
  const el = document.getElementById('lesson-content'); 
  const now = getMoscowNow(); 
  if (!isWorkTime(now) || !isWorkingDay(now)) { el.innerHTML = `<div class="waiting"><div><div class="big">😴</div>Скоро встретимся</div></div>`; return; }
  
  const dayIdx = now.getDay(); 
  const daysMap = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота']; 
  const currentDay = daysMap[dayIdx]; 
  const currentHalf = now.getHours() < 12 ? 'I' : 'II'; 
  const cleanStr = (s) => String(s).toLowerCase().replace(/[«»"']/g, '').replace(/\s+/g, ' ').trim(); 
  const targetGroup = cleanStr(activeLessonGroup); 
  const todayLessons = allLessons.filter(l => cleanStr(l.group).includes(targetGroup) || targetGroup.includes(cleanStr(l.group))).filter(l => l.day.toLowerCase() === currentDay.toLowerCase()); 
  if (todayLessons.length === 0) { el.innerHTML = `<div class="waiting"><div><div class="big">🎨</div>На ${currentDay} занятий нет</div></div>`; return; } 
  const sorted = todayLessons.sort((a, b) => a.half.localeCompare(b.half)); 
  let html = ''; let lastHalf = ''; 
  sorted.forEach(l => { 
    if (l.half !== lastHalf) { 
      const isActive = l.half === currentHalf; 
      html += `<div class="half-divider ${isActive ? 'active-half' : ''}"><span>${l.half === 'I' ? '🌅' : '🌇'}</span> <span>${l.half} половина дня</span>${isActive ? '<span style="margin-left:auto; font-size:9px;">(Сейчас)</span>' : ''}</div>`; 
      lastHalf = l.half; 
    } 
    let badgeCls = 'od'; let titleText = 'ОД'; 
    if (l.type === 'ОДРМ') { badgeCls = 'odrm'; titleText = 'КП'; } 
    else if (l.type === 'СД') { badgeCls = 'sd'; titleText = 'СД'; } 
    else if (l.type === 'КП') { badgeCls = 'kp'; titleText = 'КП'; } 
    else if (l.type === 'КРР') { badgeCls = 'hall'; titleText = 'КРР'; } 
    html += `<div class="lesson-card ${(currentHalf === 'II' && l.half === 'I') ? 'past' : ''}"><div class="l-area">${l.subject}</div><div class="l-title">${titleText}</div><div class="l-meta"><span class="badge ${badgeCls}">${l.type}</span>${l.isHall ? '<span class="badge hall">🏛 В зале</span>' : ''}</div></div>`; 
  }); 
  el.innerHTML = html; 

  setTimeout(() => {
    const activeDivider = el.querySelector('.half-divider.active-half');
    if (activeDivider) activeDivider.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function renderDay() { 
  const el = document.getElementById('day-content'); 
  if (!allRegime.length) return; 
  const now = getMoscowNow(); 
  if (!isWorkTime(now) || !isWorkingDay(now)) { el.innerHTML = `<div class="waiting"><div><div class="big">😴</div>Скоро встретимся</div></div>`; return; }
  
  const isSummer = (now.getMonth() + 1 >= 6 && now.getMonth() + 1 <= 8); 
  const targetSeason = isSummer ? 'Летний' : 'Учебный'; 
  const curMin = minutesOfDay(now); 
  const groupRegime = allRegime.filter(r => r.group === activeDayGroup && r.season === targetSeason); 
  if (groupRegime.length === 0) { el.innerHTML = `<div class="waiting"><div><div class="big">📅</div>Нет данных</div></div>`; return; } 
  groupRegime.sort((a, b) => a.order - b.order); 
  
  let activeIndex = -1;
  for (let i = 0; i < groupRegime.length; i++) {
    const item = groupRegime[i];
    if (!item.start) continue;
    const sParts = item.start.split(':'); 
    const eParts = item.end ? item.end.split(':') : [];
    if (sParts.length >= 2) { 
      const sMin = t(Number(sParts[0]), Number(sParts[1])); 
      if (eParts.length >= 2) { 
        const eMin = t(Number(eParts[0]), Number(eParts[1])); 
        if (curMin >= sMin && curMin < eMin) { activeIndex = i; break; }
      } else {
        if (curMin >= sMin) activeIndex = i;
      }
    }
  }

  if (activeIndex === -1) {
    for (let i = groupRegime.length - 1; i >= 0; i--) {
      const item = groupRegime[i];
      if (!item.start) continue;
      const sParts = item.start.split(':');
      if (sParts.length >= 2) {
        const sMin = t(Number(sParts[0]), Number(sParts[1]));
        if (curMin >= sMin) { activeIndex = i; break; }
      }
    }
  }

  let html = '<div class="day-list" style="display:flex; flex-direction:column; gap:6px;">'; 
  
  groupRegime.forEach((item, index) => { 
    const isActive = (index === activeIndex);
    let progress = 0;
    
    if (isActive && item.start && item.end) {
      const sParts = item.start.split(':');
      const eParts = item.end.split(':');
      if (sParts.length >= 2 && eParts.length >= 2) {
        const sMin = t(Number(sParts[0]), Number(sParts[1]));
        const eMin = t(Number(eParts[0]), Number(eParts[1]));
        if (eMin > sMin) {
          progress = Math.round(((curMin - sMin) / (eMin - sMin)) * 100);
          progress = Math.max(0, Math.min(100, progress));
        }
      }
    }
    
    const timeDisplay = item.end ? `${item.start}–${item.end}` : item.start;
    html += `<div class="moment ${isActive ? 'active' : ''}"><div class="m-time">${timeDisplay}</div><div class="m-name">${item.action}</div>${isActive ? `<div class="m-progress"><div style="width:${progress}%"></div></div>` : ''}</div>`; 
  }); 
  el.innerHTML = html + '</div>'; 

  setTimeout(() => {
    const activeMoment = el.querySelector('.moment.active');
    if (activeMoment) activeMoment.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

function renderMenu() {
  const el = document.getElementById('food-content');
  const now = getMoscowNow();
  
  if (!isWorkTime(now) || !isWorkingDay(now)) { el.innerHTML = `<div class="waiting"><div><div class="big">😴</div>Скоро встретимся</div></div>`; return; }
  
  if (!allMenu.length) { el.innerHTML = `<div class="waiting"><div><div class="big">🍲</div>Меню нет</div></div>`; return; }

  const curMin = minutesOfDay(now);
  
  const meals = [
    { key: 'Завтрак', s: t(8,30), e: t(9,0) },
    { key: '2-ой завтрак', s: t(10,10), e: t(10,40) },
    { key: 'Обед', s: t(12,20), e: t(13,0) },
    { key: 'Полдник', s: t(15,30), e: t(16,0) },
    { key: 'Ужин', s: t(16,30), e: t(17,0) },
  ];
  
  let currentMeal = meals.find(m => curMin >= m.s && curMin < m.e);
  if (!currentMeal) currentMeal = meals.find(m => curMin < m.s) || meals[meals.length-1];

  const menuDay = getMenuDay(now);
  const targetDayString = `День ${menuDay}`;

  let html = `<div class="food-header">
    <div class="f-name">🍴 ${currentMeal.key} <span style="font-size:0.7em; opacity:0.7; font-weight:normal;">(День ${menuDay})</span></div>
    <div class="f-time">${pad(Math.floor(currentMeal.s/60))}:${pad(currentMeal.s%60)}</div>
  </div>`;

  const groupsToShow = ['Ясли', 'Сад', 'Оздоровительная']; 
  let hasDishes = false;

  groupsToShow.forEach(groupName => {
    const dishes = allMenu.filter(m => 
      m.day.includes(groupName) && 
      m.day.includes(targetDayString) && 
      m.meal === currentMeal.key
    );

    if (dishes.length > 0) {
      hasDishes = true;
      let color = '#4dabf7'; 
      if (groupName === 'Ясли') color = '#a78bfa';
      else if (groupName === 'Оздоровительная') color = '#51cf66';

      html += `<div class="food-subtitle" style="border-left-color: ${color};">${groupName}</div>`;
      html += `<div class="food-items">`;
      
      dishes.forEach(d => {
        const w = d.weight.replace(/\.0$/, '').replace(/\./g, ',');
        html += `<div class="food-item"><span class="fi-name">${d.dish}</span><span class="fi-weight">${w} г</span></div>`;
      });
      
      html += `</div>`;
    }
  });

  if (!hasDishes) {
    html += `<div class="waiting"><div><div class="big">🍲</div>На этот день меню нет</div></div>`;
  }

  el.innerHTML = html;
}

function renderEvents() {
  const el = document.getElementById('calendar-content');
  if (!allEvents.length) {
    el.innerHTML = `<div class="waiting"><div><div class="big">🎉</div>Событий нет</div></div>`;
    return;
  }

  const now = getMoscowNow();
  const currentMonth = now.getMonth() + 1;
  const currentYear = now.getFullYear();
  const todayStr = `${currentYear}-${pad(currentMonth)}-${pad(now.getDate())}`;

  const monthEvents = allEvents.filter(e => {
    if (!e.date) return false;
    let d = String(e.date).trim();
    if (d.includes('.')) {
      const parts = d.split('.');
      if (parts.length === 3) d = `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    const parts = d.split('-');
    if (parts.length !== 3) return false;
    return parseInt(parts[0]) === currentYear && parseInt(parts[1]) === currentMonth;
  });

  if (!monthEvents.length) {
    el.innerHTML = `<div class="waiting"><div><div class="big">📅</div>На этот месяц событий нет</div></div>`;
    return;
  }

  monthEvents.sort((a, b) => a.date.localeCompare(b.date));

  let html = '';
  monthEvents.forEach(ev => {
    let d = String(ev.date).trim();
    if (d.includes('.')) {
      const parts = d.split('.');
      if (parts.length === 3) d = `${parts[2]}-${parts[1]}-${parts[0]}`;
    }
    const isToday = d === todayStr;
    
    const parts = d.split('-');
    const day = parseInt(parts[2]);
    const mon = MONTHS_SHORT_RU[parseInt(parts[1]) - 1];

    html += `<div class="cal-item ${isToday ? 'today' : ''}">
      <div class="cal-date">
        <div class="d">${day}</div>
        <div class="m">${mon}</div>
      </div>
      <div class="cal-info">
        <div class="ci-title">${ev.time ? ev.time + ' · ' : ''}${ev.title} <span style="font-weight:normal;opacity:0.8;">(${ev.topic})</span></div>
        <div class="ci-sub">${ev.group}${ev.place ? ' · ' + ev.place : ''}</div>
        <div class="ci-sub" style="margin-top: 2px; opacity: 0.7;">${ev.person}</div>
      </div>
      ${isToday ? '<span class="cal-badge" style="background:#fff;color:#ff8a3d;">Сегодня</span>' : ''}
    </div>`;
  });

  el.innerHTML = html;
}

renderClock(); loadData(); setInterval(renderClock, 1000);
setInterval(loadData, 5 * 60_000);                              // данные раз в 5 минут
setInterval(() => { renderLesson(); renderDay(); }, 60_000);    // половина дня / режим
</script>
